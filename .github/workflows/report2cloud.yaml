name: report2cloud

# The report converter in tools/report2cloud: the conversion of its corpus
# against the snapshots, the command line, and the abaplint gates over every
# generated class - linted in a scratch copy of this repository with its own
# v750 and ABAP Cloud configs, so a change to src/ that breaks the classes
# the converter writes fails here too (tools/report2cloud/README.md).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: report2cloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report2cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'
    - run: npm ci
    - run: npm run test:report2cloud
