name: check-abap2ui5

# The abap2UI5-linter: the app classes and the views their builder chains
# produce, against the UI5 1.71 floor. Settings in abap2ui5lint.jsonc. The
# render gate drives a headless browser, hence the Playwright install.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-abap2ui5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-abap2ui5:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'
    - run: npm ci
    - run: npx playwright install chromium --with-deps
    - run: npx abap2ui5lint
