name: abaplint

# The three release gates. v750 is the source as written (the downport rule
# keeps it downportable), cloud checks it against the released-API surface of
# ABAP Cloud, v702 downports a scratch copy (.github/scripts/check-702.sh) and
# checks that. The dependencies are resolved from their main branches, so the
# weekly run catches an upstream rename while no pull request is open.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abaplint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  abaplint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [lint, 'check:cloud', 'check:702']
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'
    - run: npm ci
    - run: npm run ${{ matrix.check }}
